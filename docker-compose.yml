services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketforge-postgres
    restart: unless-stopped
    environment:
      # Owner role: runs migrations. Owners bypass RLS, so the API must NOT use it.
      POSTGRES_USER: ${POSTGRES_USER:-ticketforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketforge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ticketforge}
      # Restricted role the API connects as (created by docker/postgres/init).
      APP_DB_USER: ${APP_DB_USER:-ticketforge_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-ticketforge_app_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticketforge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketforge-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP the app sends to
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web inbox: http://localhost:8025

volumes:
  postgres_data:
  redis_data:
